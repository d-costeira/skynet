# Host settings shared by the setup scripts in foundation/scripts.
# No secrets belong here: this file is committed. Secrets go in
# foundation/inference/.env, which git ignores.

# Skynet's address on the home network (DHCP reservation in OPNsense).
SKYNET_IP=10.46.22.12

# Networks allowed to SSH into Skynet, space-separated CIDRs. Skynet's own
# subnet is 10.46.22.0/24. If your workstation (e.g. GHOSTWHEEL) sits on a
# different VLAN, add that subnet here before running 06-configure-firewall.sh;
# the script refuses to run if your current SSH session isn't covered, so a
# wrong value fails safe rather than locking you out.
SSH_ALLOWED_SUBNETS="10.46.22.0/24"

# NVIDIA driver branch (580 is required by the CUDA 13.0 vLLM v0.30.0 image).
NVIDIA_DRIVER_BRANCH=580

# NVIDIA Container Toolkit version, as pinned in NVIDIA's install guide.
NVIDIA_CONTAINER_TOOLKIT_VERSION=1.20.1-1

# Per-card GPU power limit in watts, applied at every boot.
# Start at 275, then try 250 and 225 while benchmarking.
GPU_POWER_LIMIT=275

# Where the 1 TB SSD is mounted, and what lives on it.
DATA_ROOT=/srv
MODELS_DIR=/srv/models
DOCKER_DATA_ROOT=/srv/docker

# The model both proposals use.
MODEL_REPO=cyankiwi/Qwen3.8-27B-AWQ-INT4
MODEL_DIR_NAME=Qwen3.8-27B-AWQ-INT4

# vLLM image, pinned by digest (multi-arch index for tag v0.30.0, pushed 2026-09-22).
VLLM_IMAGE=vllm/vllm-openai:v0.30.0@sha256:8a69ffad015f138d7170c4ddc429e230a3bc1c1719f67e14324749df200a4b90
